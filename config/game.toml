# gotham4 game functions that pgr4's host code hooks. Found by behaviour with
# scripts/re/funcdb.py; docs/native-renderer-plan.md, Phase 7, has how.
#
# The vehicle camera (Cam::CameraImp, source CameraChase.cpp) keeps its mode
# at +496: 256 chase, 257 bumper, 258 and 259 (the dash view, which reads
# Camera.Dash.HeadAmount) and 768 are others that reuse the bumper
# placement. sub_827D4688 is the per-frame update that switches on it, and
# sub_827D5AE8 is SetMode(camera, mode).

[functions]
0x827DAC20 = { name = "Camera_PlaceBumper" } # (camera, height f1): eye = the car's bumper mount (+304) + height * the car's up axis + Camera.Bumper.{Car,Bike}{Forward,Side}; mode 257 passes +1492 (0 after SetMode), the others 0.5
0x823FD7D0 = { name = "CrowdRenderer_AddModelBlock" } # (renderer, block): appends to the 880-block ring of people drawn as models (count +8868)
0x823FC1B0 = { name = "CrowdRenderer_AddSpriteCell" } # (renderer, cell): appends to the sprite cell list (count +0x1E5C8, 2,300 entries from +0x1E5CC) with no bounds check

# The garage walk camera (sub_827DCBA0, Camera.Walk.*) moves by stick *
# Camera.Walk.Speed (5 mph) * the frame time, through the collision callback
# sub_824BB618 (camera +644). That splits the step into trunc(length * 20)
# sub-steps of up to 5 cm and moves nothing when the count is 0, so above
# about 45 fps a full-stick step never moves. The hook sits before the extsw
# that follows the count's load into r29 (src/game/garage_walk.cpp).
[[midasm_hook]]
address = 0x824BB70C
name = "GarageWalk_SubstepCount"
registers = ["r29"]

# The crowds (src/game/crowds.cpp). The scene build sub_82404ED8 (cells r3,
# view r4) loads the cells' near range (+52, times 10) and far range (+48, the
# course's CrowdSettings.DrawDistance or 120), then Crowds.Flags.FlagDrawDistance,
# and compares each visible cell's distance against them. The hooks sit before
# the store or splat that follows each load.
[[midasm_hook]]
address = 0x82404F08
name = "Crowds_ScaleDetailDistance"
registers = ["f0", "r3", "r4"]

[[midasm_hook]]
address = 0x82404F34
name = "Crowds_ScaleDrawDistance"
registers = ["f0"]

[[midasm_hook]]
address = 0x82404F54
name = "Crowds_ScaleFlagDistance"
registers = ["v12"]

# The crowd update (sub_823E9650) passes the cells' +52 to sub_823E3B40, which
# flags each cell far once every view is 10 times that away; scaled like the
# model range above. Before the bl.
[[midasm_hook]]
address = 0x823E96A4
name = "Crowds_ScaleUpdateDistance"
registers = ["f1"]
