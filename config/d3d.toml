# XDK 2.0.6132.4 Direct3D, as statically linked into PGR4's default.xex (with
# title update 0.0.2.1 applied, which is what codegen and the runtime load).
#
# Found by behaviour in the codegen output with scripts/re/funcdb.py, from the
# kernel imports, the {Get, Set, Default} state tables, the PM4 packets each
# function writes and the device fields it touches. Shape matching against
# pgr3's 2099 names (scripts/re/match_names.py) gives 1.00 only for leaf code
# (D3D_AllocDevice, D3DDevice_Release, the lock helpers, XG utilities); every
# function that touches the device or a resource header was rewritten between
# 2099 and 6132. Names marked "by behaviour" fit what the code does but have
# no anchor beyond that. docs/native-renderer-plan.md, Phase 4 findings, has
# the method and the open items.
#
# The game's frame end, sub_822B3B08, resolves the front buffer (flags 0x300)
# and calls D3DDevice_Swap itself, as PGR3's does, then blocks on the previous
# frame's fence and inserts a new one. D3DDevice_Present exists, but only
# mercury (the engine core, sub_828697B8) calls it.
#
# Shaders: the game creates them the XG way (sub_822B34A0 VS, sub_822B35F0
# PS: XGGetMicrocodeShaderParts, its own allocation, XGSet*ShaderHeader,
# XGRegister*Shader). mercury's loaders (sub_8286F7B0 VS, sub_8286F9F0 PS)
# take that path too unless bit 2 of their flags is set, in which case they
# call D3DDevice_Create{Vertex,Pixel}Shader, which do not go through
# XGGetMicrocodeShaderParts. A census or renderer has to hook both.
#
# Command buffers: Direct3D_CreateDevice with type 2 (D3DDEVTYPE_COMMAND_BUFFER)
# makes a recording device. The vehicle renderer (sub_82423218 begins,
# sub_82423648 ends and runs) records each car's draws once into a command
# buffer and replays it with D3DDevice_RunCommandBuffer, unless the game
# tweakable Vehicle.DisableCommandBuffers (value byte at 0x82AAABE4) is set,
# when it draws immediately. Its default is 1, so retail draws immediately.
#
# Not named: the D3DTexture/D3DSurface UnlockRect and LockRect thunks and the
# GetSurfaceLevel/GetCubeMapSurface/GetVolumeLevel family (one-line tail calls
# that match several thunks), sub_826C6100 (the float viewport SetViewport
# converts to), sub_826C8F30 (FVF to declaration, used by SetFVF), and the
# command-buffer calls between create and run (sub_826D5D20, sub_826D6198,
# sub_826D6468, sub_826D5C88).
#
# D3DResource is 24 bytes in 6132 (2099: 12): Common (+0, the D3DRESOURCETYPE
# in bits 0-3), ReferenceCount (+4), Fence (+8), ReadFence (+12), Identifier
# (+16), BaseFlush (+20). Shaders, declarations, constant and command buffers
# are resources too. The device and resource layouts are in src/gpu/d3d.h.

